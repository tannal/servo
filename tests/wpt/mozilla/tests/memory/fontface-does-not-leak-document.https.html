<!DOCTYPE html>
<title>Document objects for added and removed iframes that use FontFace are collected</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="resources/leak-helpers.js"></script>
<body>
    <script>
      const tests = [
        [
          "FontFace.load() that never finishes downloading",
          `<script>
            const face = new FontFace("slow", "url('/common/slow.py?delay=60000')");
            face.load();
          <\/script>`,
        ],
      ];

      for (const [name, test] of tests) {
        promise_test(async () => {
          assert_true(await createAndDestroyIframeWithHTML(test));
        }, `'${name}' does not leak the document`);
      }
    </script>
</body>
