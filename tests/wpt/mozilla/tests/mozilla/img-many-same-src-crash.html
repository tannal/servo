<!doctype html>
<meta charset="utf-8">
<title>Many img elements with the same src do not cause quadratic memory growth</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
async_test(function(t) {
    const count = 2000;
    const src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==";
    document.body.innerHTML = `<img src="${src}">`.repeat(count);

    window.addEventListener("load", t.step_func_done(function() {
        const imgs = document.querySelectorAll("img");
        assert_equals(imgs.length, count);
        for (const img of imgs) {
            assert_true(img.complete);
            assert_equals(img.naturalWidth, 1);
            assert_equals(img.naturalHeight, 1);
        }
    }));
}, "Loading 2000 <img> elements with the same data URL completes without OOM or timeout");
</script>
</body>
