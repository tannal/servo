name: Linux Fuzzing
on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      fuzzing-args:
        default: ""
        required: false
        type: string
      binary-path:
        required: true
        default: ""
        type: string
      force-github-hosted-runner:
        required: false
        default: false
        type: boolean

env:
  RUST_BACKTRACE: 1
  SHELL: /bin/bash
  GST_PLUGIN_FEATURE_RANK: pulsesink:NONE,alsasink:NONE,jacksink:NONE,fakesink:MAX

jobs:
  # Runs the underlying job (“workload”) on a self-hosted runner if available,
  # with the help of a `runner-select` job.
  runner-select:
    runs-on: ubuntu-24.04
    outputs:
      unique-id: ${{ steps.select.outputs.unique-id }}
      selected-runner-label: ${{ steps.select.outputs.selected-runner-label }}
      runner-type-label: ${{ steps.select.outputs.runner-type-label }}
      is-self-hosted: ${{ steps.select.outputs.is-self-hosted }}
    steps:
      - name: Runner select
        id: select
        uses: servo/ci-runners/actions/runner-select@b42c96524cdd72126255602c69c4ad649c750ebf
        with:
          GITHUB_TOKEN: ${{ github.token }}
          github-hosted-runner-label: ubuntu-22.04
          self-hosted-image-name: servo-ubuntu2204
          # You can disable self-hosted runners globally by creating a repository variable named
          # NO_SELF_HOSTED_RUNNERS with any non-empty value.
          # <https://github.com/servo/servo/settings/variables/actions>
          NO_SELF_HOSTED_RUNNERS: ${{ vars.NO_SELF_HOSTED_RUNNERS }}
          # Any other boolean conditions that disable self-hosted runners go here.
          force-github-hosted-runner: ${{ inputs.force-github-hosted-runner }}

  linux-fuzzing:
    needs:
      - runner-select
    name: Fuzzing [${{ needs.runner-select.outputs.unique-id }}]
    runs-on: ${{ needs.runner-select.outputs.selected-runner-label }}
    steps:
      - uses: servo/ci-runners/actions/checkout@b42c96524cdd72126255602c69c4ad649c750ebf
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.profile }}-binary-linux
          path: ${{ inputs.profile }}-binary-linux
      - name: Unpack binary
        run: tar -xzf ${{ inputs.profile }}-binary-linux/servo-tech-demo.tar.gz
      - name: Setup Python
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/setup-python
      - name: Cache uv packages
        if: ${{ runner.environment != 'self-hosted' }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-fuzzing-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-fuzzing-${{ runner.os }}-
      - name: Cache fuzzing runner
        if: ${{ runner.environment != 'self-hosted' }}
        uses: actions/cache@v5
        with:
          path: target/fuzzing-runner
          key: fuzzing-runner-${{ hashFiles('python/servo/fuzzing.py') }}
      - name: Change Mirror Priorities
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/apt-mirrors
      - name: Install runtime dependencies
        if: ${{ runner.environment != 'self-hosted' }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gstreamer1.0-gl \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            libegl1 \
            libgl1-mesa-dri \
            libgles2 \
            libgstreamer-plugins-bad1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libgstreamer1.0-0 \
            libunwind8 \
            libvulkan1 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libxmu6
      - name: Run fuzzing replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./mach test-fuzzing \
            --bin ${{ inputs.binary-path }} \
            --profile ${{ inputs.profile }} \
            --output target/fuzzing \
            --jobs $(nproc) \
            --force-download \
            ${{ inputs.fuzzing-args }}
      - name: Publish test summary
        if: ${{ always() }}
        run: |
          if [ -f target/fuzzing/report.md ]; then
            cat target/fuzzing/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive fuzzing results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: fuzzing-results-linux-${{ inputs.profile }}
          path: target/fuzzing/
          if-no-files-found: warn
